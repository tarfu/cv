extends: default

# jernoxIT Corporate Identity Theme
# Basiert auf den Farben des jernoxIT Logos

brand:
  teal: '1b7b8a'
  light_green: '7ec9a4'
  gray: '4a4a4a'
  light_bg: 'f5f5f5'

page:
  background_color: ffffff
  layout: portrait
  margin: [2cm, 2cm, 2.5cm, 2cm]
  size: A4

base:
  font_color: $brand_gray
  font_family: Helvetica
  font_size: 10
  line_height_length: 12
  line_height: $base_line_height_length / $base_font_size

role:
  name:
    font_size: 24
    font_color: $brand_teal
    font_style: bold
  title:
    font_size: 14
    font_color: $brand_light_green
    font_style: normal
  subtitle:
    font_size: 14
    font_color: $brand_light_green
    font_style: normal
  
heading:
  font_color: $brand_teal
  font_family: Helvetica
  font_style: bold
  line_height: 1.2
  margin_top: 18
  margin_bottom: 12
  h1_font_size: 24
  h2_font_size: 14
  h3_font_size: 11
  
title_page:
  align: left
  title:
    top: 55%
    font_size: 27
    font_color: $brand_teal
    font_style: bold
  subtitle:
    font_size: 14
    font_color: $brand_light_green
    font_style: normal
  authors:
    margin_top: 10
    font_size: 11
    font_color: $brand_gray
    
header:
  height: 1.5cm
  line_height: 1
  font_size: 9
  font_color: $brand_gray
  recto:
    left:
      content: 'jernoxIT GmbH • Systems Engineering & Cloud Solutions'
    right:
      content: '{document-title}'
  verso:
    left:
      content: $header_recto_left_content
    right:
      content: $header_recto_right_content
      
footer:
  height: 1cm
  line_height: 1
  font_size: 8
  font_color: $brand_gray
  border_color: $brand_teal
  border_width: 1
  padding: [6, 0, 0, 0]
  recto:
    left:
      content: 'jernoxIT GmbH'
    center:
      content: 'Georgenstr. 32a • 64331 Weiterstadt • contact@jernoxit.de • www.jernoxit.de'
    right:
      content: '{page-number} / {page-count}'
  verso:
    left:
      content: $footer_recto_left_content
    center:
      content: $footer_recto_center_content
    right:
      content: $footer_recto_right_content

link:
  font_color: $brand_teal
  
codespan:
  font_color: $brand_gray
  font_family: Courier
  font_size: 9
  
code:
  font_color: $brand_gray
  font_family: Courier
  font_size: 9
  background_color: $brand_light_bg
  border_color: $brand_teal
  border_radius: 2
  border_width: 0.5
  padding: 6
  
table:
  background_color: $brand_light_bg
  head:
    font_style: bold
    font_color: ffffff
    background_color: $brand_teal
  body:
    stripe_background_color: fafafa
  cell:
    padding: 6
  border_color: ffffff
  border_width: 0.5
  
admonition:
  column_rule_color: $brand_teal
  column_rule_width: 2
  padding: [8, 12, 8, 12]
  label:
    font_style: bold
    font_color: $brand_teal
    
sidebar:
  background_color: $brand_light_bg
  border_color: $brand_teal
  border_radius: 4
  border_width: 1
  padding: 12
  title:
    align: center
    font_color: $brand_teal
    font_style: bold
    
quote:
  border_color: $brand_light_green
  border_width: 3
  cite:
    font_color: $brand_gray
    font_size: 9
