name: Build CV PDFs

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
    tags:
      - 'v*'

  # Trigger on pull requests
  pull_request:
    branches:
      - main

  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  build:
    name: Build CV PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CVs with Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/documents \
            asciidoctor/docker-asciidoctor \
            /bin/bash -c "cd /documents && chmod +x build.sh && ./build.sh"

      - name: Upload CV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: output/*.pdf
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: output/*.pdf
          body: |
            ## CV Build ${{ github.ref_name }}

            This release contains all CV versions in German and English:

            ### German Versions (DE)
            - **Vollversion** - Full version with all projects
            - **Kurzversion** - Short version without archive projects

            ### English Versions (EN)
            - **Full** - Full version with all projects
            - **Short** - Short version without archive projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
