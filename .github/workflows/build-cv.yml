name: Build CV PDFs

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
    tags:
      - 'v*'

  # Trigger on pull requests
  pull_request:
    branches:
      - main

  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  build:
    name: Build CV PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install asciidoctor-pdf
        run: |
          gem install asciidoctor-pdf
          gem install rouge

      - name: Install fonts (if needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu

      - name: Build CVs
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload CV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: output/*.pdf
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: output/*.pdf
          body: |
            ## CV Build ${{ github.ref_name }}

            This release contains all CV versions in German and English:

            ### German Versions (DE)
            - **Vollversion** - Full version with all projects
            - **Kurzversion** - Short version without archive projects
            - **Minimal** - Minimal theme with all projects

            ### English Versions (EN)
            - **Full** - Full version with all projects
            - **Short** - Short version without archive projects
            - **Minimal** - Minimal theme with all projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
