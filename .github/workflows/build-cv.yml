name: Build CV PDFs

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
    tags:
      - 'v*'

  # Trigger on pull requests
  pull_request:
    branches:
      - main

  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  build:
    name: Build CV PDFs
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CVs with Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/documents \
            asciidoctor/docker-asciidoctor \
            /bin/bash -c "cd /documents && chmod +x build.sh && ./build.sh"

      # Upload each PDF as a separate artifact for better visibility
      # If a PDF doesn't exist, the step is automatically skipped

      - name: Upload German Full Version
        if: hashFiles('output/CV_Tobias_Breitwieser_Vollversion_DE.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CV_Tobias_Breitwieser_Vollversion_DE.pdf
          path: output/CV_Tobias_Breitwieser_Vollversion_DE.pdf
          retention-days: 90

      - name: Upload German Short Version
        if: hashFiles('output/CV_Tobias_Breitwieser_Kurzversion_DE.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CV_Tobias_Breitwieser_Kurzversion_DE.pdf
          path: output/CV_Tobias_Breitwieser_Kurzversion_DE.pdf
          retention-days: 90

      - name: Upload English Full Version
        if: hashFiles('output/CV_Tobias_Breitwieser_Full_EN.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CV_Tobias_Breitwieser_Full_EN.pdf
          path: output/CV_Tobias_Breitwieser_Full_EN.pdf
          retention-days: 90

      - name: Upload English Short Version
        if: hashFiles('output/CV_Tobias_Breitwieser_Short_EN.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: CV_Tobias_Breitwieser_Short_EN.pdf
          path: output/CV_Tobias_Breitwieser_Short_EN.pdf
          retention-days: 90

      - name: Create combined ZIP archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd output
          zip -r ../CV_All_Versions_${{ github.ref_name }}.zip *.pdf
          cd ..
          echo "Created ZIP: CV_All_Versions_${{ github.ref_name }}.zip"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            output/*.pdf
            CV_All_Versions_${{ github.ref_name }}.zip
          body: |
            ## CV Build ${{ github.ref_name }}

            This release contains all CV versions in German and English.

            ### Download Options:
            - **Individual PDFs**: Download specific versions from the assets below
            - **All versions (ZIP)**: Download `CV_All_Versions_${{ github.ref_name }}.zip`

            ### German Versions (DE)
            - **Vollversion** - Full version with all projects
            - **Kurzversion** - Short version without archive projects

            ### English Versions (EN)
            - **Full** - Full version with all projects
            - **Short** - Short version without archive projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
